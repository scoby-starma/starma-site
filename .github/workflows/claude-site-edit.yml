# When the team editor files an issue labeled "site-edit", Claude makes the change on a new
# branch and opens a pull request. Cloudflare builds a preview link for the PR.
# Nothing goes live until Justin merges the PR.
#
# Follow-ups: comment "@claude <what to change>" on the issue or the PR.
# Requires the repository secret ANTHROPIC_API_KEY.

name: Claude website edits

on:
  issues:
    # Fires when the editor creates an issue with the label, or someone adds the label later.
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  new-request:
    if: github.event_name == 'issues' && github.event.label.name == 'site-edit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: site-edit-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch photos attached to edit requests
        run: git fetch origin edit-uploads:refs/remotes/origin/edit-uploads || true
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are updating the Star Martial Arts website for a team edit request.
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Read the issue with `gh issue view ${{ github.event.issue.number }}` and follow CLAUDE.md exactly. Then:
            1. Create a branch named edit/issue-${{ github.event.issue.number }}.
            2. Make only the change requested. If a photo is attached, it is on the edit-uploads branch:
               `git checkout origin/edit-uploads -- <path>`, optimize it as CLAUDE.md describes, and do not commit the original.
            3. Run `npm run build` and make sure it succeeds.
            4. Commit, push, and open a pull request with `gh pr create`. Title it after the issue. In the body include
               "Closes #${{ github.event.issue.number }}" and a plain-English summary of what changed, written for a non-technical owner.
            5. Comment on the issue with a short summary and the PR link, and say the preview link will appear on the PR.

            If the request is unclear, would require inventing facts, or changes the SMS consent or privacy wording,
            do not guess: comment on the issue with one clear question and stop.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm run build),Bash(npx --yes sharp-cli:*),Bash(python3:*),Bash(ls:*),Bash(mkdir:*),Bash(mv:*),Bash(cp:*),Bash(rm:*)"

  follow-up:
    if: >-
      github.event_name != 'issues' &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm run build),Bash(npx --yes sharp-cli:*),Bash(python3:*),Bash(ls:*),Bash(mkdir:*),Bash(mv:*),Bash(cp:*),Bash(rm:*)"
